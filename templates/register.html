{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<div class="form-panel">
<h1>Criar conta</h1>
<form method="post">
  <label>Nome<input name="name" maxlength="100" required></label>
  <label>E-mail<input type="email" name="email" maxlength="150" required></label>
  <label>Senha (mínimo 8 caracteres)<input type="password" name="password" minlength="8" required></label>
  <button class="button" type="submit">Criar conta</button>
</form>
</div>
{% endblock %}
